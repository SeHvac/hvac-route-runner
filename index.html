const select=document.getElementById('routeSelect');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filterRoutes(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 let first=null;
 [...select.options].forEach(o=>{
   const r=routes.find(x=>x.route===Number(o.value));
   const hay=(r.route+" "+r.area+" "+r.corridor+" "+r.prospects.map(p=>p.business+" "+p.address).join(" ")).toLowerCase();
   o.hidden=!!q && !hay.includes(q);
   if(!o.hidden && first===null) first=o;
 });
 if(first){select.value=first.value;showRoute(first.value)}
}
function showRoute(n){
 const r=routes.find(x=>x.route===Number(n)); if(!r)return;
 let out='<div class="card"><div class="route-title">Route '+r.route+'</div><div class="muted">'+esc(r.area)+' • '+r.stops+' stops • '+esc(r.corridor)+'</div><div class="small">'+esc(r.mix)+'</div>';
 r.segments.forEach(s=>out+='<a class="button google" href="'+s.url+'" target="_blank">Open Google Maps — Segment '+s.segment+'</a>');
 out+='</div><div class="card"><label>Stops</label>';
 r.prospects.sort((a,b)=>a.stop-b.stop).forEach(p=>{
   const q=encodeURIComponent(p.address);
   const apple='maps://?address='+q;
   const google='https://www.google.com/maps/search/?api=1&query='+q;
   out+='<div class="stop"><div><span class="num">'+p.stop+'</span><span class="biz">'+esc(p.business)+'</span></div><div class="addr">'+esc(p.address)+'</div><div class="stop-actions"><a class="button apple" href="'+apple+'">Apple Maps</a><a class="button google" href="'+google+'" target="_blank">Google Maps</a>'+(p.phone?'<a class="button light" href="tel:'+p.phone+'">Call</a>':'')+'</div></div>';
 });
 out+='</div>';document.getElementById('content').innerHTML=out;
 document.getElementById('mainGoogle').href=r.segments.length?r.segments[0].url:'#';
}
showRoute(1);
